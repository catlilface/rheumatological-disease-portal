x-health: &health
  interval: 10s
  timeout: 8s
  retries: 10
  start_period: 15s

# Временный билд, пока сервисы не реализованы
x-build: &build
  context: .
  dockerfile: packages/service-runtime/Dockerfile

x-grpc: &grpc
  restart: unless-stopped
  networks:
    - rpc
  healthcheck:
    <<: *health
    test: [CMD, python, -c, "import grpc; from grpc_health.v1 import health_pb2 as p,health_pb2_grpc as g; assert g.HealthStub(grpc.insecure_channel('localhost:50051')).Check(p.HealthCheckRequest(),timeout=3).status==1"]

x-worker: &worker
  <<: *grpc
  environment:
    KAFKA_BOOTSTRAP_SERVERS: 'kafka:19092'
  networks:
    - rpc
    - broker
  depends_on:
    kafka:
      condition: service_healthy

# One-off DB tooling per service: migrations (as the postgres superuser) and
# the isolation/integrity test suites (as the least-privilege app_<service>
# role). Separate from packages/service-runtime, which stays on Python 3.15
# and never touches Postgres - see packages/migration-runtime/Dockerfile.
x-db: &db
  profiles: ["migrate"]
  networks: [databases]
  secrets: [postgres-password, service-db-password]
  depends_on:
    postgres:
      condition: service_healthy

services:
  bff:
    image: rdp-bff:mvp
    build:
      context: .
      dockerfile: services/bff/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - edge
      - rpc
    env_file:
      - .env
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]

  iam:
    <<: *grpc
    image: rdp-iam:mvp
    build: {<<: *build, args: {SERVICE: iam}}
    # `databases` lets `docker compose run iam alembic upgrade head` (or
    # pytest) reach postgres:5432; main.py itself does not touch SQL yet.
    networks: [rpc, databases]

  files:
    <<: *grpc
    image: rdp-files:mvp
    build: {<<: *build, args: {SERVICE: files}}
    networks: [rpc, objects, databases]

  screening:
    <<: *worker
    image: rdp-screening:mvp
    build: {<<: *build, args: {SERVICE: screening}}
    networks: [rpc, broker, databases]

  content:
    <<: *worker
    image: rdp-content:mvp
    build: {<<: *build, args: {SERVICE: content}}
    networks: [rpc, broker, databases]

  reporting:
    <<: *worker
    image: rdp-reporting:mvp
    build: {<<: *build, args: {SERVICE: reporting}}
    networks: [rpc, broker, databases]

  iam-db:
    <<: *db
    image: rdp-iam-db:mvp
    build:
      context: .
      dockerfile: packages/migration-runtime/Dockerfile
      args: {SERVICE: iam}
    environment:
      DATABASE__HOST: postgres
      DATABASE__PORT: "5432"
      DATABASE__USER: postgres
      DATABASE__NAME: iam

  screening-db:
    <<: *db
    image: rdp-screening-db:mvp
    build:
      context: .
      dockerfile: packages/migration-runtime/Dockerfile
      args: {SERVICE: screening}
    environment:
      DATABASE__HOST: postgres
      DATABASE__PORT: "5432"
      DATABASE__USER: postgres
      DATABASE__NAME: screening

  content-db:
    <<: *db
    image: rdp-content-db:mvp
    build:
      context: .
      dockerfile: packages/migration-runtime/Dockerfile
      args: {SERVICE: content}
    environment:
      DATABASE__HOST: postgres
      DATABASE__PORT: "5432"
      DATABASE__USER: postgres
      DATABASE__NAME: content

  reporting-db:
    <<: *db
    image: rdp-reporting-db:mvp
    build:
      context: .
      dockerfile: packages/migration-runtime/Dockerfile
      args: {SERVICE: reporting}
    environment:
      DATABASE__HOST: postgres
      DATABASE__PORT: "5432"
      DATABASE__USER: postgres
      DATABASE__NAME: reporting

  files-db:
    <<: *db
    image: rdp-files-db:mvp
    build:
      context: .
      dockerfile: packages/migration-runtime/Dockerfile
      args: {SERVICE: files}
    environment:
      DATABASE__HOST: postgres
      DATABASE__PORT: "5432"
      DATABASE__USER: postgres
      DATABASE__NAME: files

  ai-db:
    <<: *db
    image: rdp-ai-db:mvp
    build:
      context: .
      dockerfile: packages/migration-runtime/Dockerfile
      args: {SERVICE: ai}
    environment:
      DATABASE__HOST: postgres
      DATABASE__PORT: "5432"
      DATABASE__USER: postgres
      DATABASE__NAME: ai

  kafka:
    image: apache/kafka:4.4.0
    restart: unless-stopped
    networks:
      - broker
    env_file: infra/k8s/kafka.env
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      <<: *health
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, localhost:19092, --list]

  postgres:
    image: postgres:18.7-alpine3.23
    restart: unless-stopped
    networks:
      - databases
    secrets:
      - postgres-password
      - service-db-password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/k8s/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      <<: *health
      test: [CMD, pg_isready, -h, localhost, -U, postgres, -d, postgres]

  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    command: [server, -dir=/data, -ip=localhost, -ip.bind=0.0.0.0, -filer, -master.volumeSizeLimitMB=64, -volume.max=8]
    restart: unless-stopped
    networks:
      - objects
    volumes:
      - objects-data:/data
    healthcheck:
      <<: *health
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:8888/']

  qdrant:
    image: qdrant/qdrant:v1.20.2
    restart: unless-stopped
    networks:
      - vectors
    volumes:
      - vectors-data:/qdrant/storage
    healthcheck:
      <<: *health
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3; read -r line <&3; [[ $$line == *' 200 '* ]]"]

secrets:
  postgres-password:
    file: ./.secrets/postgres-password
  service-db-password:
    file: ./.secrets/service-db-password
networks:
  edge:
  rpc:
    internal: true
  broker:
    internal: true
  databases:
    internal: true
  objects:
    internal: true
  vectors:
    internal: true
volumes:
  kafka-data:
  postgres-data:
  objects-data:
  vectors-data:
