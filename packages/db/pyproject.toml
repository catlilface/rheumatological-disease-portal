[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rheuma-db"
version = "0.1.0"
description = "Shared Postgres/SQLAlchemy plumbing for rheumatological-disease-portal services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.3,<4.0",
    "pydantic>=2.6,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
