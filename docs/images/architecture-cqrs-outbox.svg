<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-cqrs-outbox-title architecture-cqrs-outbox-desc" id="architecture-cqrs-outbox-root">
        <title id="architecture-cqrs-outbox-title">CQRS и transactional outbox</title>
        <desc id="architecture-cqrs-outbox-desc">BFF получает подтверждение приёма команды, владелец проверяет IAM и фиксирует изменение с событием в outbox, после чего публикует событие и обслуживает чтение по gRPC.</desc>
        <defs>
      <style>#architecture-cqrs-outbox-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-cqrs-outbox-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-cqrs-outbox-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-cqrs-outbox-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="architecture-cqrs-outbox-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="architecture-cqrs-outbox-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="architecture-cqrs-outbox-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

