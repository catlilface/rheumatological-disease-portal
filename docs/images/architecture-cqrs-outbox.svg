        <text x="40" y="64" font-family="'Instrument Serif', 'Noto Serif', serif" font-size="28" font-weight="400" fill="#2d3142" text-anchor="start">CQRS: приём команды ≠ выполнение</text>
<text x="40" y="92" font-family="'Geist', system-ui, sans-serif" font-size="11" font-weight="400" fill="#4f5d75" text-anchor="start">Outbox связывает изменение и событие одной локальной транзакцией. Чтение остаётся синхронным.</text>
