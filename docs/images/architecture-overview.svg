<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-overview-title architecture-overview-desc" id="architecture-overview-root">
        <title id="architecture-overview-title">Общая архитектура портала</title>
        <desc id="architecture-overview-desc">BFF принимает браузерные запросы, направляет команды через Kafka и читает данные сервисов по gRPC, а IAM отвечает за сессии и доступ.</desc>
        <defs>
      <style>#architecture-overview-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-overview-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-overview-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-overview-root .diagram-container { overflow-x: visible; }
}</style>
