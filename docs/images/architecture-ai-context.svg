<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-ai-context-title architecture-ai-context-desc" id="architecture-ai-context-root">
        <title id="architecture-ai-context-title">Подготовка контекста AI</title>
        <desc id="architecture-ai-context-desc">AI получает события в локальную проекцию, сверяет результаты поиска с версиями источников и проверяет IAM перед обращением к LLM и выдачей ответа через BFF.</desc>
        <defs>
      <style>#architecture-ai-context-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-ai-context-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-ai-context-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-ai-context-root .diagram-container { overflow-x: visible; }
}</style>
