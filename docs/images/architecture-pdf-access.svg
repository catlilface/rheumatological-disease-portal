<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-pdf-access-title architecture-pdf-access-desc" id="architecture-pdf-access-root">
        <title id="architecture-pdf-access-title">Доступ к PDF через IAM</title>
        <desc id="architecture-pdf-access-desc">Files выдаёт PDF из закрытого SeaweedFS только после актуальной проверки IAM и срока разрешения, иначе новая выдача отклоняется.</desc>
        <defs>
      <style>#architecture-pdf-access-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-pdf-access-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-pdf-access-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-pdf-access-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="architecture-pdf-access-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="architecture-pdf-access-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="architecture-pdf-access-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
          <!--
          <pattern id="architecture-pdf-access-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          -->
        <marker id="architecture-pdf-access-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- <rect width="100%" height="100%" fill="url(#architecture-pdf-access-dots)" opacity="0.55"/> -->

        <text x="40" y="64" font-family="'Instrument Serif', 'Noto Serif', serif" font-size="28" font-weight="400" fill="#2d3142" text-anchor="start">Готовый PDF не означает право на скачивание</text>
<text x="40" y="92" font-family="'Geist', system-ui, sans-serif" font-size="11" font-weight="400" fill="#4f5d75" text-anchor="start">Files проверяет актуальный доступ и срок разрешения при каждом новом запросе.</text>
<rect x="80" y="376" width="1152" height="248" rx="4" fill="#2d3142" stroke="#bfc0c0" stroke-width="1" fill-opacity="0.02" />
<rect x="80" y="376" width="40" height="16" rx="2" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="1" />
<text x="100" y="388" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">ALT</text>
<text x="96" y="408" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="start">[права подтверждены, TTL разрешения не истёк]</text>
