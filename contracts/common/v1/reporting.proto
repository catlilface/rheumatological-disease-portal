syntax = "proto3";

package rheuma.reporting.v1;

import "contracts/common/v1/screening.proto";
import "google/protobuf/timestamp.proto";

enum ReportStatus {
  REPORT_STATUS_UNSPECIFIED = 0;
  REPORT_STATUS_PENDING = 1;
  REPORT_STATUS_GENERATING = 2;
  REPORT_STATUS_READY = 3;
  REPORT_STATUS_FAILED = 4;
}

// Immutable inputs: a later screening result never silently changes this PDF.
message ReportSpecification {
  rheuma.screening.v1.ResultReference result = 1;
  string template_version = 2;
  string locale = 3;
}

message Report {
  string report_id = 1;
  uint64 version = 2;
  ReportSpecification specification = 3;
  ReportStatus status = 4;
  // Present only when READY. An opaque Files ID, never a SeaweedFS URL.
  string file_id = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp generated_at = 7;
  // Present only when FAILED; contains no medical details.
  string failure_code = 8;
}
