# Запуск из корня репозитория. В .env задайте TAG_NAME, общий для всех образов.
x-health: &health
  interval: 10s
  timeout: 8s
  retries: 10
  start_period: 15s

x-grpc: &grpc
  restart: unless-stopped
  environment:
    - PGHOST=postgres
  networks:
    - rpc
    - databases
  healthcheck:
    <<: *health
    test: [CMD, python, -c, "import grpc; from grpc_health.v1 import health_pb2 as p,health_pb2_grpc as g; assert g.HealthStub(grpc.insecure_channel('localhost:50051')).Check(p.HealthCheckRequest(),timeout=3).status==1"]

x-worker: &worker
  <<: *grpc
  environment:
    PGHOST: postgres
    KAFKA_BOOTSTRAP_SERVERS: 'kafka:19092'
  networks:
    - rpc
    - broker
    - databases
  depends_on:
    kafka:
      condition: service_healthy

services:
  frontend:
    image: ghcr.io/catlilface/rheumatology-portal-frontend:${TAG_NAME:?Set TAG_NAME}
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - edge
    environment:
      NGINX_BACKEND_URL: ${NGINX_BACKEND_URL:-http://bff:8000}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-100m}
      NGINX_RESOLVER: ${NGINX_RESOLVER:-127.0.0.11}

  bff:
    image: ghcr.io/catlilface/rheumatology-portal-bff:${TAG_NAME:?Set TAG_NAME}
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      edge:
        aliases: [server] # Совместимость с NGINX_BACKEND_URL=http://server:8000
      rpc:
    env_file:
      - .env
    healthcheck:
      <<: *health
      test: [CMD, wget, -q, -T, "4", -O, /dev/null, http://127.0.0.1:8000/health]

  iam:
    <<: *grpc
    image: ghcr.io/catlilface/rheumatology-portal-iam:${TAG_NAME:?Set TAG_NAME}
    volumes: ["${MIS_SECRET_DIR:-./.secrets}/db/apps/iam:/run/secrets/db-password:ro"]

  files:
    <<: *grpc
    image: ghcr.io/catlilface/rheumatology-portal-files:${TAG_NAME:?Set TAG_NAME}
    networks:
      - rpc
      - objects
      - databases
    volumes: ["${MIS_SECRET_DIR:-./.secrets}/db/apps/files:/run/secrets/db-password:ro"]

  screening:
    <<: *worker
    image: ghcr.io/catlilface/rheumatology-portal-screening:${TAG_NAME:?Set TAG_NAME}
    volumes: ["${MIS_SECRET_DIR:-./.secrets}/db/apps/screening:/run/secrets/db-password:ro"]

  content:
    <<: *worker
    image: ghcr.io/catlilface/rheumatology-portal-content:${TAG_NAME:?Set TAG_NAME}
    volumes: ["${MIS_SECRET_DIR:-./.secrets}/db/apps/content:/run/secrets/db-password:ro"]

  reporting:
    <<: *worker
    image: ghcr.io/catlilface/rheumatology-portal-reporting:${TAG_NAME:?Set TAG_NAME}
    volumes: ["${MIS_SECRET_DIR:-./.secrets}/db/apps/reporting:/run/secrets/db-password:ro"]

  ai:
    image: ghcr.io/catlilface/rheumatology-portal-ai:${TAG_NAME:?Set TAG_NAME}
    restart: unless-stopped
    environment: {PGHOST: postgres}
    networks: [databases, vectors]
    volumes: ["${MIS_SECRET_DIR:-./.secrets}/db/apps/ai:/run/secrets/db-password:ro"]
    healthcheck:
      <<: *health
      test: [CMD, python, database.py, ai]

  db-bootstrap:
    profiles: [tools]
    image: ghcr.io/catlilface/rheumatology-portal-db-bootstrap:${TAG_NAME:?Set TAG_NAME}
    networks: [databases]
    secrets: [postgres-password]
    volumes:
      - ./infra/db/bootstrap.sh:/bootstrap.sh:ro
      - ${MIS_SECRET_DIR:-./.secrets}/db:/credentials:ro
    entrypoint: [sh, /bootstrap.sh]

  db-migrate:
    profiles: [tools]
    image: ghcr.io/catlilface/rheumatology-portal-db-migrate:${TAG_NAME:?Set TAG_NAME}
    networks: [databases]
    entrypoint: [sh, /db/migrate.sh]
    volumes:
      - ./infra/db:/db:ro
      - ${MIS_SECRET_DIR:-./.secrets}/db/migrators:/credentials:ro
      - ./services/iam/migrations:/services/iam/migrations:ro
      - ./services/screening/migrations:/services/screening/migrations:ro
      - ./services/content/migrations:/services/content/migrations:ro
      - ./services/reporting/migrations:/services/reporting/migrations:ro
      - ./services/files/migrations:/services/files/migrations:ro
      - ./services/ai/migrations:/services/ai/migrations:ro

  kafka:
    image: ghcr.io/catlilface/rheumatology-portal-kafka:${TAG_NAME:?Set TAG_NAME}
    restart: unless-stopped
    networks:
      - broker
    env_file: infra/k8s/kafka.env
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      <<: *health
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, localhost:19092, --list]

  postgres:
    image: ghcr.io/catlilface/rheumatology-portal-postgres:${TAG_NAME:?Set TAG_NAME}
    restart: unless-stopped
    networks:
      - databases
    secrets:
      - postgres-password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      <<: *health
      test: [CMD, pg_isready, -h, localhost, -U, postgres, -d, postgres]

  seaweedfs:
    image: ghcr.io/catlilface/rheumatology-portal-seaweedfs:${TAG_NAME:?Set TAG_NAME}
    command: [server, -dir=/data, -ip=localhost, -ip.bind=0.0.0.0, -filer, -master.volumeSizeLimitMB=64, -volume.max=8]
    restart: unless-stopped
    networks:
      - objects
    volumes:
      - objects-data:/data
    healthcheck:
      <<: *health
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:8888/']

  qdrant:
    image: ghcr.io/catlilface/rheumatology-portal-qdrant:${TAG_NAME:?Set TAG_NAME}
    restart: unless-stopped
    networks:
      - vectors
    volumes:
      - vectors-data:/qdrant/storage
    healthcheck:
      <<: *health
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3; read -r line <&3; [[ $$line == *' 200 '* ]]"]

secrets:
  postgres-password:
    file: ${MIS_SECRET_DIR:-./.secrets}/postgres-password
networks:
  edge:
  rpc:
    internal: true
  broker:
    internal: true
  databases:
    internal: true
  objects:
    internal: true
  vectors:
    internal: true
volumes:
  kafka-data:
  postgres-data:
  objects-data:
  vectors-data:
