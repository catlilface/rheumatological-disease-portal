name: Services CI

on:
  workflow_call:
  pull_request:
    paths:
      - "services/**"
      - "frontend/src/pages/cabinet/**"
      - "frontend/src/shared/api/**"
      - "frontend/tests/integration/patient.mjs"
      - "packages/service-runtime/**"
      - "contracts/**"
      - "infra/db/**"
      - "infra/bff-delivery.compose.yaml"
      - "infra/tests/compose-ports.sh"
      - "infra/check-transport.sh"
      - "infra/k8s/check-http.py"
      - "infra/smoke.sh"
      - "infra/k8s/kafka.env"
      - "compose.yaml"
      - "deploy.yml"
      - ".env.example"
      - "Makefile"
      - ".dockerignore"
      - ".github/workflows/services.yml"

concurrency:
  group: services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Database migrations and role isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: make test-db

  compose-smoke:
    name: Compose contracts and storage integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify only the frontend port is published in each stack
        run: bash infra/tests/compose-ports.sh
      - run: make up
      - name: Verify IAM sessions against PostgreSQL and through the BFF
        run: |
          docker compose exec -T iam python -m unittest -v service.tests.test_policy service.tests.test_sessions service.tests.test_bff
          docker compose run --rm --no-deps -v "$PWD/.secrets/portal-tls-v2/bff:/run/test-bff-tls:ro" screening python -m unittest -v service.tests.transport_e2e
          python3 infra/k8s/check-http.py http://127.0.0.1:8080 --via-frontend
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - name: Patient journey in Chrome against the running portal
        working-directory: frontend
        run: npm ci && npm run test:patient-e2e
      - name: Check gRPC contracts, Kafka commands and BFF isolation
        run: bash infra/check-transport.sh compose
      - name: Check persistence after storage restart
        run: bash infra/smoke.sh compose
      - name: Remove test stack and volumes
        if: always()
        run: docker compose down -v

  build:
    needs: [migrations, compose-smoke]
    name: ${{ matrix.service }} CI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [bff, ai, content, files, iam, reporting, screening]
    permissions:
      contents: read
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: matrix.service == 'bff'
        with:
          go-version-file: services/bff/go.mod
          cache-dependency-path: services/bff/go.sum

      - name: Test BFF
        if: matrix.service == 'bff'
        working-directory: services/bff
        run: |
          go vet ./...
          go test -race ./...

      - name: Kafka and PostgreSQL delivery integration
        if: matrix.service == 'bff'
        run: make test-bff-delivery

      - name: Build BFF image
        if: matrix.service == 'bff'
        run: docker build -f services/bff/Dockerfile -t "rheumatology-portal-$SERVICE:ci" .

      # TODO: Подключить проверки остальных доменных сервисов
      # по мере реализации. Пока собираем их образы на общем runtime, как в Compose.
      - name: Build service image
        if: matrix.service != 'bff'
        run: |
          docker build -f packages/service-runtime/Dockerfile --build-arg "SERVICE=$SERVICE" \
            -t "rheumatology-portal-$SERVICE:ci" .
