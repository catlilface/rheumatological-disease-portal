name: Publish release images

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frontend:
    uses: ./.github/workflows/frontend.yml
  services:
    uses: ./.github/workflows/services.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.semver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: semver
        run: |
          tag=$(python3 .github/next-version.py)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: [version, frontend, services]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG_NAME: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse to overwrite an existing version
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            echo "Tag $TAG_NAME already exists" >&2
            exit 1
          fi

      - name: Resolve image names
        run: |
          cp .env.example .env
          docker compose -f compose.yaml --profile tools config --format json > "$RUNNER_TEMP/source.json"
          docker compose -f deploy.yml --profile tools config --format json > "$RUNNER_TEMP/release.json"

      - name: Build application images
        run: docker compose -f compose.yaml --profile tools build

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish every image required by deploy.yml
        run: |
          for service in $(jq -r '.services | keys[]' "$RUNNER_TEMP/release.json"); do
            source=$(jq -er --arg s "$service" '.services[$s].image' "$RUNNER_TEMP/source.json")
            target=$(jq -er --arg s "$service" '.services[$s].image' "$RUNNER_TEMP/release.json")
            if ! jq -e --arg s "$service" '.services[$s].build' "$RUNNER_TEMP/source.json" > /dev/null; then
              docker pull "$source"
            fi
            docker tag "$source" "$target"
            docker push "$target"
          done

      - name: Create Git tag and GitHub Release with deployment bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          archive="portal-$TAG_NAME.tar.gz"
          git archive --format=tar.gz -o "$archive" HEAD -- deploy.yml .env.example infra/db infra/k8s/kafka.env 'services/*/migrations/*'
          gh release create "$TAG_NAME" "$archive" --target "$GITHUB_SHA" --title "$TAG_NAME" --generate-notes
