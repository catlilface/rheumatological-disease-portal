name: Kubernetes smoke
on:
  pull_request:
    paths:
      - 'infra/**'
      - 'services/**'
      - 'contracts/**'
      - 'packages/service-runtime/**'
      - 'docker-compose.yaml'
      - '.dockerignore'
      - 'Makefile'
      - '.github/workflows/kubernetes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.33.0
          kubectl_version: v1.37.0
      - name: Shell guard regressions
        run: make test-infra
      - name: Fresh kind cluster and runtime checks
        run: make test-kind
      - name: Upload diagnostics (never credentials or kubeconfig)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-diagnostics
          include-hidden-files: true
          path: |
            .secrets/kind-check.*/status.txt
            .secrets/kind-check.*/events.txt
            .secrets/kind-check.*/port-forward.log
          if-no-files-found: ignore
