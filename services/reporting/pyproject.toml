[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mis-reporting"
version = "0.1.0"
description = "Reporting service: PDF report jobs and reproducible-render snapshots (reporting database)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rheuma-db",
    "pydantic-settings>=2.6,<3.0",
    "alembic>=1.18,<2.0",
]

[tool.uv.sources]
rheuma-db = { path = "../../packages/db", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
