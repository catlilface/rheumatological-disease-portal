---
apiVersion: v1
kind: Service
metadata:
  name: content
spec:
  selector:
    app: content
  ports:
  - name: client
    port: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content
spec:
  replicas: 1
  selector:
    matchLabels: &1
      app: content
  template:
    metadata:
      labels: *1
    spec:
      automountServiceAccountToken: false
      containers:
      - name: content
        image: rdp-content:mvp
        ports:
        - containerPort: 50051
        volumeMounts:
        - {name: database, mountPath: /run/secrets, readOnly: true}
        env:
        - {name: PGHOST, value: postgres}
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka:19092
        readinessProbe:
          grpc:
            port: 50051
          periodSeconds: 10
          timeoutSeconds: 8
      volumes:
      - name: database
        secret:
          secretName: db-app-content
          items: [{key: password, path: db-password}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: content
spec:
  podSelector:
    matchLabels:
      app: content
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - bff
          - ai
    ports:
    - protocol: TCP
      port: 50051
