---
apiVersion: v1
kind: Service
metadata:
  name: iam
spec:
  selector:
    app: iam
  ports:
  - name: client
    port: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam
spec:
  replicas: 1
  selector:
    matchLabels: &1
      app: iam
  template:
    metadata:
      labels: *1
    spec:
      automountServiceAccountToken: false
      containers:
      - name: iam
        image: rdp-iam:mvp
        ports:
        - containerPort: 50051
        env:
        - {name: PGHOST, value: postgres}
        - {name: IAM_ADMIN_EMAIL, valueFrom: {secretKeyRef: {name: iam-bootstrap, key: email, optional: true}}}
        - {name: IAM_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: iam-bootstrap, key: password, optional: true}}}
        volumeMounts:
        - {name: database, mountPath: /run/secrets, readOnly: true}
        - {name: tls, mountPath: /run/iam-tls, readOnly: true}
        readinessProbe:
          tcpSocket:
            port: 50051
          periodSeconds: 10
          timeoutSeconds: 8
      volumes:
      - name: database
        projected:
          sources:
          - secret: {name: db-app-iam, items: [{key: password, path: db-password}]}
          - secret: {name: iam-key}
      - name: tls
        secret: {secretName: portal-tls-v2-iam}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iam
spec:
  podSelector:
    matchLabels:
      app: iam
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions: [{key: app, operator: In, values: [bff, screening]}]
    ports:
    - protocol: TCP
      port: 50051
