---
apiVersion: v1
kind: Service
metadata:
  name: iam
spec:
  selector:
    app: iam
  ports:
  - name: client
    port: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam
spec:
  replicas: 1
  selector:
    matchLabels: &1
      app: iam
  template:
    metadata:
      labels: *1
    spec:
      automountServiceAccountToken: false
      containers:
      - name: iam
        image: rdp-iam:mvp
        ports:
        - containerPort: 50051
        readinessProbe:
          grpc:
            port: 50051
          periodSeconds: 10
          timeoutSeconds: 8
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iam
spec:
  podSelector:
    matchLabels:
      app: iam
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - bff
          - files
          - screening
          - reporting
          - content
    ports:
    - protocol: TCP
      port: 50051
