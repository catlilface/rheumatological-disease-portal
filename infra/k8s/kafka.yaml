---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
  - name: client
    port: 19092
  clusterIP: None
  publishNotReadyAddresses: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels: &1
      app: kafka
  serviceName: kafka
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  template:
    metadata:
      labels: *1
    spec:
      automountServiceAccountToken: false
      containers:
      - name: kafka
        image: apache/kafka:4.4.0
        ports:
        - containerPort: 19092
        envFrom:
        - configMapRef:
            name: kafka-config
        volumeMounts:
        - name: data
          mountPath: "/var/lib/kafka/data"
        readinessProbe:
          exec:
            command:
            - "/opt/kafka/bin/kafka-topics.sh"
            - "--bootstrap-server"
            - localhost:19092
            - "--list"
          periodSeconds: 10
          timeoutSeconds: 8
      securityContext:
        fsGroup: 1000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - content
          - reporting
          - screening
          - kafka
    ports:
    - protocol: TCP
      port: 19092
