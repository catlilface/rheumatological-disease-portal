---
apiVersion: v1
kind: Service
metadata:
  name: bff
spec:
  selector:
    app: bff
  ports:
  - name: client
    port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
spec:
  replicas: 1
  selector:
    matchLabels: &1
      app: bff
  template:
    metadata:
      labels: *1
    spec:
      automountServiceAccountToken: false
      containers:
      - name: bff
        image: rdp-bff:mvp
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            port: 8000
            path: /health
            httpHeaders:
            - name: Host
              value: localhost
          periodSeconds: 10
          timeoutSeconds: 8
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bff
spec:
  podSelector:
    matchLabels:
      app: bff
  policyTypes:
  - Ingress
  ingress: []
