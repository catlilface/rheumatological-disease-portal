---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  selector:
    app: qdrant
  ports:
  - name: client
    port: 6333
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
spec:
  replicas: 1
  selector:
    matchLabels: &1
      app: qdrant
  serviceName: qdrant
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  template:
    metadata:
      labels: *1
    spec:
      automountServiceAccountToken: false
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.20.2
        ports:
        - containerPort: 6333
        volumeMounts:
        - name: data
          mountPath: "/qdrant/storage"
        readinessProbe:
          httpGet:
            port: 6333
            path: "/readyz"
          periodSeconds: 10
          timeoutSeconds: 8
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant
spec:
  podSelector:
    matchLabels:
      app: qdrant
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - ai
    ports:
    - protocol: TCP
      port: 6333
