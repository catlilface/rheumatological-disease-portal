# Firewall-only kube-router, alongside kindnet and kube-proxy.
# Based on cloudnativelabs/kube-router v2.12.0 daemonset/kube-router-firewall-daemonset.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-router
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-router
rules:
- apiGroups: [""]
  resources: [namespaces, pods, services, nodes]
  verbs: [get, list, watch]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: [get, list, watch]
- apiGroups: [discovery.k8s.io]
  resources: [endpointslices]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-router
subjects:
- kind: ServiceAccount
  name: kube-router
  namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-router
  namespace: kube-system
spec:
  selector:
    matchLabels: {k8s-app: kube-router}
  template:
    metadata:
      labels: {k8s-app: kube-router}
    spec:
      serviceAccountName: kube-router
      priorityClassName: system-node-critical
      hostNetwork: true
      hostPID: true
      dnsPolicy: Default
      tolerations:
      - {operator: Exists}
      nodeSelector: {kubernetes.io/os: linux}
      containers:
      - name: kube-router
        image: cloudnativelabs/kube-router:v2.12.0
        args:
        - --run-router=false
        - --run-firewall=true
        - --run-service-proxy=false
        - --enable-cni=false
        - --iptables-sync-period=5s
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef: {fieldPath: spec.nodeName}
        - name: POD_NAME
          valueFrom:
            fieldRef: {fieldPath: metadata.name}
        securityContext: {privileged: true}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
        startupProbe:
          httpGet: {path: /healthz, port: 20244}
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet: {path: /healthz, port: 20244}
          periodSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - {name: lib-modules, mountPath: /lib/modules, readOnly: true}
        - {name: xtables-lock, mountPath: /run/xtables.lock}
      volumes:
      - name: lib-modules
        hostPath: {path: /lib/modules}
      - name: xtables-lock
        hostPath: {path: /run/xtables.lock, type: FileOrCreate}
