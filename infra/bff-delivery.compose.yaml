services:
  frontend:
    # Keep the unauthenticated delivery demo on loopback, behind nginx.
    ports: !override
      - "127.0.0.1:8080:80"
    environment:
      NGINX_BACKEND_URL: http://bff:8000

  bff:
    networks: [edge, rpc, databases, broker]
    environment:
      BFF_DELIVERY_ENABLED: "true"
      BFF_DELIVERY_PUBLISH: "${BFF_DELIVERY_PUBLISH:-true}"
    volumes:
      - "${MIS_SECRET_DIR:-./.secrets}/db/apps/bff:/run/secrets/db-password:ro"

  db-bootstrap:
    environment:
      MIS_BFF_DB: "true"
